<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[ VALVE CONTROLLER ]</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: #1a1a1a;
            color: #0f0;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        h1 {
            font-size: 1.4rem;
            color: #0f0;
            letter-spacing: 2px;
        }

        #connection-indicator {
            font-size: 0.8rem;
            padding: 4px 10px;
            border: 1px solid #0f0;
            border-radius: 3px;
            color: #0f0;
        }

        #connection-indicator.offline {
            border-color: #f00;
            color: #f00;
        }

        .panel {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .panel-title {
            font-size: 0.75rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        /* Status bar */
        #status-bar {
            background: #030;
            border: 1px solid #0f0;
            border-radius: 5px;
            padding: 12px 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #status-bar.active {
            background: #300;
            border-color: #f00;
        }

        #status-bar.active #status-text { color: #f84; }

        #status-text {
            font-size: 1rem;
            font-weight: bold;
            color: #0f0;
            letter-spacing: 1px;
        }

        #timer {
            font-size: 1.6rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            color: #0f0;
        }

        #status-bar.active #timer { color: #f84; }

        /* Zone grid */
        #zones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .zone-panel {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 14px;
        }

        .zone-panel.active {
            border-color: #0f0;
            background: #020a02;
        }

        .zone-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .zone-number {
            font-size: 1.1rem;
            font-weight: bold;
            color: #0f0;
        }

        .zone-status {
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
            display: inline-block;
        }

        .zone-panel.active .dot {
            background: #0f0;
            box-shadow: 0 0 6px #0f0;
        }

        .zone-status-text {
            color: #555;
        }

        .zone-panel.active .zone-status-text {
            color: #0f0;
        }

        .zone-controls {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .duration-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #555;
        }

        .duration-row input {
            width: 65px;
            padding: 4px 6px;
            background: #111;
            border: 1px solid #333;
            border-radius: 3px;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            text-align: center;
        }

        .duration-row input:focus {
            outline: none;
            border-color: #0f0;
        }

        .btn-row {
            display: flex;
            gap: 6px;
        }

        button {
            padding: 6px 14px;
            background: #222;
            border: 1px solid #0f0;
            color: #0f0;
            border-radius: 3px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        button:hover:not(:disabled) {
            background: #1a3a1a;
        }

        button:disabled {
            border-color: #333;
            color: #444;
            cursor: not-allowed;
        }

        button.danger {
            border-color: #f00;
            color: #f00;
        }

        button.danger:hover:not(:disabled) {
            background: #2a0000;
        }

        /* Activity log */
        #log {
            max-height: 160px;
            overflow-y: auto;
            font-size: 0.78rem;
            line-height: 1.6;
        }

        .log-entry { color: #555; }
        .log-entry.open { color: #0f0; }
        .log-entry.close { color: #f44; }
        .log-entry.error { color: #f80; }
    </style>
</head>
<body>

    <header>
        <h1>[ VALVE CONTROLLER ]</h1>
        <span id="connection-indicator">ONLINE</span>
    </header>

    <div id="status-bar">
        <span id="status-text">IDLE</span>
        <span id="timer">--:--</span>
    </div>

    <div id="zones"></div>

    <div class="panel" style="margin-top: 15px;">
        <div class="panel-title">Activity Log</div>
        <div id="log"></div>
    </div>

    <script>
        const BASE = '';
        let currentStatus = null;
        let sseSource = null;
        let fallbackInterval = null;
        let knownZones = [];

        // --- Connection indicator ---
        function setOnline(online) {
            const el = document.getElementById('connection-indicator');
            el.textContent = online ? 'ONLINE' : 'OFFLINE';
            el.className = online ? '' : 'offline';
        }

        // --- Logging ---
        function addLog(msg, cls) {
            const log = document.getElementById('log');
            const t = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${cls || ''}`;
            entry.textContent = `[${t}] ${msg}`;
            log.insertBefore(entry, log.firstChild);
            if (log.children.length > 60) log.removeChild(log.lastChild);
        }

        // --- Timer formatting ---
        function formatTime(secs) {
            const s = Math.ceil(secs);
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
        }

        // --- UI update from status object ---
        function updateUI(s) {
            const statusBar = document.getElementById('status-bar');
            const statusText = document.getElementById('status-text');
            const timerEl = document.getElementById('timer');

            if (s.active) {
                statusBar.className = 'active';
                statusText.textContent = `ZONE ${s.active_zone} ACTIVE`;
                timerEl.textContent = formatTime(s.remaining_seconds);
            } else {
                statusBar.className = '';
                statusText.textContent = 'IDLE';
                timerEl.textContent = '--:--';
            }

            renderZones(s);
        }

        // --- Zone panels ---
        function renderZones(s) {
            const container = document.getElementById('zones');
            const zones = s.zones || knownZones;

            // Build or update panels
            zones.forEach(z => {
                const isActive = s.active && s.active_zone === z;
                let panel = document.getElementById(`zone-${z}`);

                if (!panel) {
                    panel = document.createElement('div');
                    panel.id = `zone-${z}`;
                    panel.innerHTML = `
                        <div class="zone-header">
                            <span class="zone-number">ZONE ${z}</span>
                            <span class="zone-status">
                                <span class="dot" id="dot-${z}"></span>
                                <span class="zone-status-text" id="zst-${z}">CLOSED</span>
                            </span>
                        </div>
                        <div class="zone-controls">
                            <div class="duration-row">
                                <label>SEC:</label>
                                <input type="number" id="dur-${z}" value="60" min="1" max="3600">
                            </div>
                            <div class="btn-row">
                                <button id="open-btn-${z}" onclick="openValve('${z}')">OPEN</button>
                                <button id="close-btn-${z}" class="danger" onclick="closeValve('${z}')" style="display:none">CLOSE</button>
                            </div>
                        </div>
                    `;
                    panel.className = 'zone-panel';
                    container.appendChild(panel);
                }

                panel.className = `zone-panel${isActive ? ' active' : ''}`;
                const openBtn = document.getElementById(`open-btn-${z}`);
                const closeBtn = document.getElementById(`close-btn-${z}`);
                const zst = document.getElementById(`zst-${z}`);

                if (openBtn) openBtn.disabled = s.active;
                if (closeBtn) closeBtn.style.display = isActive ? 'inline-block' : 'none';
                if (zst) zst.textContent = isActive ? 'OPEN' : 'CLOSED';
            });

            knownZones = zones;
        }

        // --- Fetch full status ---
        async function fetchStatus() {
            try {
                const r = await fetch(`${BASE}/api/status`);
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                currentStatus = await r.json();
                setOnline(true);
                updateUI(currentStatus);
            } catch (e) {
                setOnline(false);
            }
        }

        // --- Load config once to know zones ---
        async function fetchConfig() {
            try {
                const r = await fetch(`${BASE}/api/config`);
                if (!r.ok) return;
                const cfg = await r.json();
                knownZones = cfg.zones || [];
            } catch (_) {}
        }

        // --- Open / Close actions ---
        async function openValve(zone) {
            const durInput = document.getElementById(`dur-${zone}`);
            const dur = parseFloat(durInput.value);
            if (!dur || dur <= 0) { addLog('Invalid duration', 'error'); return; }
            try {
                const r = await fetch(`${BASE}/api/valve/${zone}/open?duration=${dur}`, {method: 'POST'});
                const d = await r.json();
                if (d.success) {
                    addLog(`Zone ${zone} opened for ${dur}s`, 'open');
                } else {
                    addLog(`${d.message}: ${JSON.stringify(d)}`, 'error');
                }
                fetchStatus();
            } catch (e) {
                addLog('Request failed: ' + e, 'error');
            }
        }

        async function closeValve(zone) {
            try {
                const r = await fetch(`${BASE}/api/valve/${zone}/close`, {method: 'POST'});
                const d = await r.json();
                if (d.success) {
                    addLog(`Zone ${zone} closed (${d.elapsed_seconds}s elapsed)`, 'close');
                } else {
                    addLog(d.message, 'error');
                }
                fetchStatus();
            } catch (e) {
                addLog('Request failed: ' + e, 'error');
            }
        }

        // --- SSE connection ---
        function startSSE() {
            if (sseSource) sseSource.close();

            sseSource = new EventSource(`${BASE}/events`);

            sseSource.addEventListener('init', (e) => {
                const s = JSON.parse(e.data);
                setOnline(true);
                updateUI(s);
                // SSE working — cancel fallback poll
                if (fallbackInterval) {
                    clearInterval(fallbackInterval);
                    fallbackInterval = null;
                }
            });

            sseSource.onmessage = (e) => {
                const evt = JSON.parse(e.data);
                if (evt.event === 'valve_change') {
                    const label = evt.state === 'open'
                        ? `Zone ${evt.zone} opened`
                        : `Zone ${evt.zone} closed`;
                    addLog(label, evt.state === 'open' ? 'open' : 'close');
                }
                // Refresh full status after event
                fetchStatus();
            };

            sseSource.onerror = () => {
                setOnline(false);
                sseSource.close();
                sseSource = null;
                // Fall back to polling every 5s
                if (!fallbackInterval) {
                    fallbackInterval = setInterval(fetchStatus, 5000);
                    // Try to reconnect SSE after 10s
                    setTimeout(startSSE, 10000);
                }
            };
        }

        // --- Boot sequence ---
        fetchConfig().then(() => {
            fetchStatus();
            startSSE();
        });
    </script>
</body>
</html>
